<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
<title id="title">Skill Swap: learn together</title><desc id="desc">An illustration of two people exchanging skills, one teaching design and the other sharing coding knowledge.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101B35"/><stop offset="1" stop-color="#183C48"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B7F4D8"/><stop offset="1" stop-color="#65DDB5"/></linearGradient></defs>
<rect width="1200" height="627" rx="28" fill="url(#bg)"/>
<circle cx="1040" cy="90" r="180" fill="#4BCBA2" opacity=".08"/><circle cx="190" cy="570" r="230" fill="#75BFFF" opacity=".07"/>
<text x="84" y="115" fill="#A9EFD2" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">SKILL SWAP PLATFORM · PART 1</text>
<text x="84" y="225" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="62" font-weight="700">What if learning</text><text x="84" y="300" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="62" font-weight="700">was a two-way street?</text>
<text x="87" y="361" fill="#C8D7E6" font-family="Arial,sans-serif" font-size="25">Share what you know. Learn what you need.</text>
<rect x="84" y="420" width="1032" height="2" fill="#FFFFFF" opacity=".15"/>
<!-- exchange cards -->
<rect x="111" y="462" width="340" height="105" rx="18" fill="#FFFFFF" opacity=".09" stroke="#FFFFFF" stroke-opacity=".16"/><circle cx="165" cy="515" r="25" fill="url(#mint)"/><text x="165" y="523" text-anchor="middle" fill="#12313A" font-family="Arial,sans-serif" font-size="21" font-weight="700">A</text><text x="207" y="508" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="23" font-weight="700">I teach design</text><text x="207" y="540" fill="#C8D7E6" font-family="Arial,sans-serif" font-size="18">In return, I learn coding</text>
<path d="M483 514h230m-22-18 22 18-22 18" fill="none" stroke="#8DE5C4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="749" y="462" width="340" height="105" rx="18" fill="#FFFFFF" opacity=".09" stroke="#FFFFFF" stroke-opacity=".16"/><circle cx="803" cy="515" r="25" fill="#9AC8FF"/><text x="803" y="523" text-anchor="middle" fill="#142642" font-family="Arial,sans-serif" font-size="21" font-weight="700">B</text><text x="845" y="508" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="23" font-weight="700">I teach coding</text><text x="845" y="540" fill="#C8D7E6" font-family="Arial,sans-serif" font-size="18">In return, I learn design</text>
</svg>
