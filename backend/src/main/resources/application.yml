spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skill_swap}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      file-size-threshold: 2MB

server:
  port: 8080
  address: 0.0.0.0

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  upload:
    directory: ${UPLOAD_DIR:uploads}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  mail:
    log-links: ${MAIL_LOG_LINKS:true}
    from: ${MAIL_FROM:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:15}
    api-per-minute: ${API_RATE_LIMIT_PER_MINUTE:180}
    trust-forwarded-header: ${TRUST_FORWARDED_HEADER:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Skill Swap Platform
    description: Community skill exchange API

logging:
  structured:
    format:
      console: logstash
  level:
    org.springframework.security: INFO
    com.skillswap: INFO
